# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# SQL Script initialization
spring.sql.init.mode=never

# Server
server.port=8080

# ChatGPT Configuration
chatgpt.api.url=https://api.openai.com
chatgpt.api.key=${OPENAI_API_KEY:your-openai-api-key-here}
chatgpt.model=gpt-4
chatgpt.max-tokens=4000
chatgpt.temperature=0.7

# File Upload Configuration
app.upload.directory=uploads
app.upload.base-url=http://localhost:8080/uploads

# Spring Boot file upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Auth / JWT (local)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.remember-me-days=${JWT_REMEMBER_ME_DAYS:7}
app.auth.reset-token-ttl-minutes=30
# Local: loga o link de redefinição de senha (útil sem SMTP configurado)
app.auth.log-reset-links=true
app.auth.bootstrap-admin.email=${ADMIN_EMAIL:admin@camarmo.com}
app.auth.bootstrap-admin.password=${ADMIN_PASSWORD:admin12345}