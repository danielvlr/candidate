# Render.com Deployment Profile

# PostgreSQL (Render provides individual DB properties)
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
# update: preserva dados entre deploys (usuários, sync Jestor) e cria tabelas/colunas novas.
# NÃO volte para create — apaga o banco inteiro a cada deploy/restart.
# Limitação: update não remove/renomeia colunas nem altera tipos; para isso, migração manual (ou Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable H2 console in production
spring.h2.console.enabled=false

# Server port (Render sets PORT env var)
server.port=${PORT:8080}

# File uploads (ephemeral on Render free tier)
app.upload.directory=/tmp/uploads
app.upload.base-url=${RENDER_EXTERNAL_URL:http://localhost:8080}/uploads

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Auth / JWT — JWT_SECRET obrigatório em produção (render.yaml gera automaticamente)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.jwt.remember-me-days=${JWT_REMEMBER_ME_DAYS:7}
app.auth.reset-token-ttl-minutes=30
app.auth.log-reset-links=false
app.auth.bootstrap-admin.email=${ADMIN_EMAIL:admin@camarmo.com}
app.auth.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:${FRONTEND_URL:http://localhost:5173}}
