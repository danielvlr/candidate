name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

# Deploy é feito pelo Render a partir da main (render.yaml); aqui só validamos build e testes.
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: backend/pom.xml

    - name: Run tests and package
      run: ./mvnw -B verify

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: backend-surefire-reports
        path: backend/target/surefire-reports/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Há erros de lint legados no código; o step reporta sem bloquear até serem corrigidos.
    - name: Run ESLint
      continue-on-error: true
      run: npm run lint

    - name: Type check and build
      run: npm run build
      env:
        VITE_API_BASE_URL: /api/v1

    - name: Upload frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7
